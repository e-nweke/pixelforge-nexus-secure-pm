{% extends "base.html" %} {% block title %} Create Project - PixelForge Nexus
{%endblock %} {% block content %}
<div class="max-w-2xl mx-auto px-4 py-8">
  <h1 class="text-2xl font-bold mb-6">Create New Project</h1>
  {% if error %}
  <p class="text-red-600 mb-4">{{ error }}</p>
  {% endif %}
  <form method="post" class="space-y-6">
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700">
        Project Name
      </label>
      <input
        type="text"
        name="name"
        id="name"
        required
        class="mt-1 block w-full border border-gray-300 rounded px-3 py-2" />
    </div>
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700">
        Description
      </label>
      <textarea
        name="description"
        id="description"
        required
        class="mt-1 block w-full border border-gray-300 rounded px-3 py-2"></textarea>
    </div>
    <div>
      <label for="deadline" class="block text-sm font-medium text-gray-700">
        Deadline
      </label>
      <input
        type="datetime-local"
        name="deadline"
        id="deadline"
        required
        class="mt-1 block w-full border border-gray-300 rounded px-3 py-2" />
    </div>
    <div>
      <label for="lead_id" class="block text-sm font-medium text-gray-700">
        Assign Project Lead
      </label>
      <select
        name="lead_id"
        id="lead_id"
        required
        class="mt-1 block w-full border border-gray-300 rounded px-3 py-2">
        <option value="" disabled selected>Select a lead</option>
        {% for lead in project_leads %}
        <option value="{{ lead.id }}">{{ lead.username }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <button
        type="submit"
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded">
        Create
      </button>
    </div>
  </form>
</div>
{% endblock %}
