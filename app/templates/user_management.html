{% extends "base.html" %}
{% block title %}User Management - PixelForge Nexus{% endblock %}
{% block content %}
<div class="max-w-4xl mx-auto px-4 py-6">
  <h1 class="text-3xl font-bold mb-6 text-center">User Management</h1>

  <div class="bg-white p-6 rounded shadow mb-10">
    <h2 class="text-xl font-semibold mb-4">Register New User</h2>
    <form action="/users/register" method="post" class="space-y-4">
      <div>
        <label for="username" class="block font-medium">Username</label>
        <input type="text" name="username" id="username" required class="w-full border rounded p-2" />
      </div>
      <div>
        <label for="password" class="block font-medium">Password</label>
        <input type="password" name="password" id="password" required class="w-full border rounded p-2" />
      </div>
      <div>
        <label for="role" class="block font-medium">Role</label>
        <select name="role" id="role" required class="w-full border rounded p-2">
          <option value="Admin">Admin</option>
          <option value="ProjectLead">ProjectLead</option>
          <option value="Developer">Developer</option>
        </select>
      </div>
      <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Register User
      </button>
    </form>
  </div>

  <div class="bg-white p-6 rounded shadow">
    <h2 class="text-xl font-semibold mb-4">All Users</h2>
    <table class="w-full text-left border border-gray-300">
      <thead class="bg-gray-100">
        <tr>
          <th class="p-3 border-b">Username</th>
          <th class="p-3 border-b">Role</th>
          <th class="p-3 border-b">Change Role</th>
          <th class="p-2">Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for u in users %}
        <tr class="border-t hover:bg-gray-50">
          <td class="p-3">{{ u.username }}</td>
          <td class="p-3">{{ u.role.value }}</td>
          <td class="p-3">
            <form action="/users/{{ u.id }}/update-role" method="post" class="flex items-center space-x-2">
              <select name="role" class="border rounded p-1">
                <option value="Admin" {% if u.role.value == 'Admin' %}selected{% endif %}>Admin</option>
                <option value="ProjectLead" {% if u.role.value == 'ProjectLead' %}selected{% endif %}>ProjectLead</option>
                <option value="Developer" {% if u.role.value == 'Developer' %}selected{% endif %}>Developer</option>
              </select>
              <button type="submit" class="bg-gray-800 text-white px-3 py-1 rounded">Update</button>
            </form>
          </td>
          <td class="p-2">
            <form action="/users/{{ u.id }}/delete" method="post" onsubmit="return confirm('Are you sure you want to delete this user?');">
              <button type="submit" class="text-sm bg-red-600 text-white px-3 py-1 rounded hover:bg-red-700">Delete</button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
